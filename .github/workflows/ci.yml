name: checks
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: payments
          POSTGRES_PASSWORD: payments
          POSTGRES_DB: payments_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U payments -d payments_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      API_KEY: ci-test-api-key-123456789
      DATABASE_URL: postgresql+asyncpg://payments:payments@localhost:5432/payments_test
      TEST_DATABASE_URL: postgresql+asyncpg://payments:payments@localhost:5432/payments_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install uv==0.9.5
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run alembic upgrade head
      - run: uv run alembic check
      - run: uv run pytest -q
