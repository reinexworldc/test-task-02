[project]
name = "test-task-2"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14,<2",
    "asyncpg>=0.30,<1",
    "fastapi>=0.115,<1",
    "faststream[cli,rabbit]>=0.5,<0.6",
    "httpx>=0.28,<1",
    "pydantic-settings>=2,<3",
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
